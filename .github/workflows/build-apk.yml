name: Сборка APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Разложить файлы по папкам
        run: |
          mkdir -p www scripts
          mv index.html www/index.html
          mv icon.py embed-fonts.mjs scripts/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установить зависимости
        run: npm install

      - name: Встроить шрифты
        run: node scripts/embed-fonts.mjs

      - name: Создать Android-проект
        run: |
          npx cap add android
          npx cap sync android

      - name: Иконка и ориентация
        run: |
          pip install pillow
          python3 scripts/icon.py android/app/src/main/res
          sed -i 's|<activity|<activity android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<item name="android:background">@null</item>|<item name="android:background">#05060A</item><item name="android:windowBackground">#05060A</item><item name="android:statusBarColor">#05060A</item><item name="android:navigationBarColor">#05060A</item>|' android/app/src/main/res/values/styles.xml

      - name: Собрать APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: iskra-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
